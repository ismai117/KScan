<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KScan Web Sample</title>
    <style>
        :root {
            --app-width: 1200px;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #17181c;
        }

        #app {
            width: 100%;
            max-width: var(--app-width);
            height: 100%;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 48px rgb(0 0 0 / 60%);
        }

        canvas { outline: none; }
    </style>
</head>
<body>
<div id="app"></div>
<script src="kscanSample.js"></script>
</body>
</html>
